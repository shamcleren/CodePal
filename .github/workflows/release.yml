name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build & Release
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Select stable Xcode
        run: |
          set -euo pipefail
          candidate="$(find /Applications -maxdepth 1 -name 'Xcode_16*.app' -print | sort -V | tail -n 1 || true)"
          if [ -n "$candidate" ]; then
            sudo xcode-select -s "$candidate/Contents/Developer"
          fi
          xcodebuild -version

      - name: Install dependencies
        run: npm ci

      - name: Install Apple Developer ID intermediates
        run: |
          set -euo pipefail
          curl -fsSLo "$RUNNER_TEMP/DeveloperIDCA.cer" https://www.apple.com/certificateauthority/DeveloperIDCA.cer
          curl -fsSLo "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDCA.cer" -k "$HOME/Library/Keychains/login.keychain-db" || true
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$HOME/Library/Keychains/login.keychain-db" || true
          security find-certificate -c "Developer ID Certification Authority" -a -p >/dev/null

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build & Package
        run: npm run dist:mac
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_NAME: "shamcle ren (ZTF4Y7VNJ2)"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Finalize release metadata
        run: node scripts/finalize-mac-release-metadata.cjs

      - name: Verify release assets
        run: node scripts/verify-mac-release-assets.cjs release

      - name: Extract version from tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: CodePal ${{ steps.version.outputs.tag }}
          body_path: docs/release/notes/release-notes-${{ steps.version.outputs.tag }}.md
          draft: true
          files: |
            release/*.dmg
            release/*.dmg.blockmap
            release/*.zip
            release/*.zip.blockmap
            release/latest-mac.yml

      - name: Verify uploaded release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          download_dir="$RUNNER_TEMP/codepal-release-download"
          rm -rf "$download_dir"
          mkdir -p "$download_dir"
          gh release download "${{ steps.version.outputs.tag }}" --dir "$download_dir" --clobber
          node scripts/verify-mac-release-assets.cjs "$download_dir"

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ steps.version.outputs.tag }}" --draft=false --latest
